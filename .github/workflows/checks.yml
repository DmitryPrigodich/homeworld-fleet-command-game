name: Build and check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build FleetCommand.Game.csproj --nologo -m:1
      - run: dotnet build tests/FleetCommand.Checks/FleetCommand.Checks.csproj --nologo -m:1
      - run: dotnet tests/FleetCommand.Checks/bin/Debug/net8.0/FleetCommand.Checks.dll check .
